<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>原始鱼缸 · 3D</title>
<style>
  html,body { margin:0;width:100%;height:100%;overflow:hidden;background:#fff; }
  canvas { display:block;width:100%;height:100%;touch-action:none;cursor:grab; }
  canvas:active { cursor:grabbing; }
</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xffffff);
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.17;
renderer.setClearColor(0xffffff, 1);
document.body.appendChild(renderer.domElement);
const camera = new THREE.PerspectiveCamera(37, 1, 0.005, 35);
camera.position.set(0.23, 0.37, 1.35);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.28, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.enablePan = false;
controls.autoRotate = false;
controls.rotateSpeed = 0.68;
controls.zoomSpeed = 0.9;
controls.minPolarAngle = 0.05;
controls.maxPolarAngle = Math.PI - 0.06;
controls.minDistance = 0.48;
controls.maxDistance = 3.5;

scene.add(new THREE.HemisphereLight(0xffffff, 0xd5e7e0, 2.7));
const light1 = new THREE.DirectionalLight(0xffffff, 2.9);
light1.position.set(-1.7, 3.0, 2.6); scene.add(light1);
const light2 = new THREE.DirectionalLight(0xe4f6ff, 1.3);
light2.position.set(2.1, 2.3, -1.5); scene.add(light2);

const fishGroups = [];
let model;
async function loadOriginalModel() {
  // Direct GLB: downloadable bundle or a conventional single-file deployment.
  const direct = await fetch('./aquarium_original_mesh.glb').catch(() => null);
  let buffer;
  if (direct && direct.ok) {
    buffer = await direct.arrayBuffer();
  } else {
    // GitHub Pages: exact binary GLB is stored as 54 gzip chunks, not a rebuilt scene.
    const parts = new Array(54);
    let cursor = 0;
    await Promise.all(Array.from({length: 8}, async () => {
      while (cursor < parts.length) {
        const i = cursor++;
        const url = './model/part-' + String(i).padStart(3, '0') + '.bin';
        const response = await fetch(url);
        if (!response.ok) throw new Error('Missing original-model chunk: ' + url);
        parts[i] = new Uint8Array(await response.arrayBuffer());
      }
    }));
    const total = parts.reduce((size, data) => size + data.byteLength, 0);
    const compressed = new Uint8Array(total);
    let offset = 0;
    for (const piece of parts) {compressed.set(piece, offset); offset += piece.byteLength;}
    if (!('DecompressionStream' in window)) throw new Error('Browser does not support gzip decompression');
    const stream = new Blob([compressed]).stream().pipeThrough(new DecompressionStream('gzip'));
    buffer = await new Response(stream).arrayBuffer();
  }
  return await new Promise((resolve, reject) => new GLTFLoader().parse(buffer, '', resolve, reject));
}
loadOriginalModel().then(({scene: original}) => {
  model = original;
  scene.add(model);

  // The GLB was extracted from the supplied Blender file. No geometry is re-created here.
  original.traverse((obj) => {
    if (!obj.isMesh) return;
    const isGlass = /^Glass_/.test(obj.name);
    const isWater = /^Water_/.test(obj.name);
    if (isGlass || isWater) {
      obj.material = obj.material.clone();
      obj.material.transparent = true;
      obj.material.opacity = isGlass ? 0.16 : 0.10;
      obj.material.depthWrite = false;
      obj.material.side = THREE.DoubleSide;
      obj.material.needsUpdate = true;
      obj.renderOrder = isWater ? 5 : 6;
    }
    if (obj.geometry && obj.geometry.attributes.position && !obj.geometry.attributes.normal) {
      obj.geometry.computeVertexNormals();
    }
  });

  // Use the original eight fish and their anatomical parts for subtle movement.
  // Reparent with world transforms preserved; no replacement fish meshes are generated.
  const grouped = new Map();
  original.traverse((obj) => {
    const match = /^Fish_(0[1-8])_/.exec(obj.name);
    if (match) {
      if (!grouped.has(match[1])) grouped.set(match[1], []);
      grouped.get(match[1]).push(obj);
    }
  });
  original.updateMatrixWorld(true);
  for (const [id, objects] of grouped) {
    const bbox = new THREE.Box3();
    objects.forEach(obj => bbox.expandByObject(obj));
    if (bbox.isEmpty()) continue;
    const pivot = bbox.getCenter(new THREE.Vector3());
    const group = new THREE.Group();
    group.name = 'Original_Fish_' + id;
    group.position.copy(pivot);
    original.add(group);
    group.updateMatrixWorld(true);
    for (const child of objects) group.attach(child);
    fishGroups.push({ group, origin:pivot.clone(), phase:Number(id)*1.37 });
  }
  const bounds = new THREE.Box3().setFromObject(original);
  if (!bounds.isEmpty()) {
    const center = bounds.getCenter(new THREE.Vector3());
    const size = bounds.getSize(new THREE.Vector3());
    controls.target.copy(center);
    const fit = () => {
      const aspect = Math.max(0.3, innerWidth / Math.max(1, innerHeight));
      camera.fov = innerWidth < 700 ? 42 : 37;
      camera.aspect = aspect; camera.updateProjectionMatrix();
      const vHalf = THREE.MathUtils.degToRad(camera.fov / 2);
      const dist = Math.max(size.y/(2*Math.tan(vHalf)*0.75), size.x/(2*Math.tan(vHalf)*aspect*0.77));
      camera.position.set(center.x + dist*0.1, center.y + dist*0.12, center.z + dist);
      controls.minDistance = Math.max(size.length()*0.44,0.36);
      controls.maxDistance = dist*4.2;
      controls.update();
    };
    fit();
    window.addEventListener('resize',fit);
  }
}).catch(error => {
  console.error('Original Blender model could not be loaded:', error);
});

function resize() {
  camera.aspect = innerWidth / Math.max(1,innerHeight);
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
  renderer.setSize(innerWidth, innerHeight);
}
window.addEventListener('resize',resize);
resize();
const clock = new THREE.Clock();
function frame() {
  const t = clock.getElapsedTime();
  for (const {group, origin, phase} of fishGroups) {
    group.position.set(origin.x + Math.sin(t*0.43+phase)*0.004,
                       origin.y + Math.sin(t*0.7+phase)*0.003,
                       origin.z + Math.cos(t*0.53+phase)*0.004);
    group.rotation.y = Math.sin(t*0.5+phase)*0.17;
  }
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
frame();
</script>
</body>
</html>
