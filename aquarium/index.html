<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Aquarium — Interactive 3D</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff}
body{overscroll-behavior:none}canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}canvas:active{cursor:grabbing}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xffffff);
const camera = new THREE.PerspectiveCamera(36,1,.05,100);
camera.position.set(5.7,3.65,6.9);
const renderer = new THREE.WebGLRenderer({antialias:true,alpha:false,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.2;
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.setClearColor(0xffffff,1);
document.body.appendChild(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,1.35,0);
controls.enableDamping=true;
controls.dampingFactor=.055;
controls.enablePan=false;
controls.minDistance=4.3;
controls.maxDistance=14;
controls.minPolarAngle=.2;
controls.maxPolarAngle=Math.PI*.62;
controls.rotateSpeed=.65;
controls.zoomSpeed=.9;
controls.update();

scene.add(new THREE.HemisphereLight(0xffffff,0xe9f0e4,2.0));
const sun=new THREE.DirectionalLight(0xffffff,2.5);
sun.position.set(-4,9,6);
sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left=-6;sun.shadow.camera.right=6;
sun.shadow.camera.top=6;sun.shadow.camera.bottom=-6;
sun.shadow.bias=-.0002;
scene.add(sun);
const fill=new THREE.DirectionalLight(0xe6f3ff,1.05);
fill.position.set(5,4,-3);scene.add(fill);

let seed=20261102;
function rnd(){seed=(Math.imul(seed,1664525)+1013904223)|0;return (seed>>>0)/4294967296}
function rr(a,b){return a+(b-a)*rnd()}
const PI=Math.PI;
const m=(color,roughness=1,metalness=0)=>new THREE.MeshStandardMaterial({color,roughness,metalness});
const sand=m(0xd8cfb7,.99),sandLight=m(0xe9dfca,.98),wood=m(0x634731,.94),wood2=m(0x79593c,.97);
const rockMats=[m(0x827d70,.98),m(0x64685c,.96),m(0x98978a,.99),m(0x746f66,.98)];
const mossMats=[m(0x345b2f,.97),m(0x466d36,.97),m(0x5a7d3b,.96)];
const world=new THREE.Group();scene.add(world);
const W=4.65,D=2.05,H=2.9;
const floor=new THREE.Mesh(new THREE.PlaneGeometry(200,200),new THREE.ShadowMaterial({color:0x999999,opacity:.13}));
floor.rotation.x=-PI/2;floor.position.y=-.028;floor.receiveShadow=true;scene.add(floor);

function box(w,h,d,mat,x,y,z,parent=world){
 const obj=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
 obj.position.set(x,y,z);obj.castShadow=true;obj.receiveShadow=true;parent.add(obj);return obj
}
const base=box(W-.13,.24,D-.13,sand,0,.13,0);
const gravelGeo=new THREE.DodecahedronGeometry(.022,0);
const gravel=new THREE.InstancedMesh(gravelGeo,sandLight,1000),dummy=new THREE.Object3D();
for(let i=0;i<1000;i++){
 const x=rr(-W/2+.13,W/2-.13),z=rr(-D/2+.11,D/2-.11);
 dummy.position.set(x,.26+rr(0,.033),z);
 dummy.rotation.set(rnd()*PI,rnd()*PI,rnd()*PI);
 dummy.scale.set(rr(.55,1.65),rr(.45,1.15),rr(.5,1.5));
 dummy.updateMatrix();gravel.setMatrixAt(i,dummy.matrix);
}world.add(gravel);
const sandPath=box(2.95,.028,.38,sandLight,0,.277,.42);
sandPath.rotation.y=-.24;

function rock(x,y,z,sx,sy,sz,matIdx){
 const o=new THREE.Mesh(new THREE.IcosahedronGeometry(1,1),rockMats[matIdx]);
 o.position.set(x,y,z);o.scale.set(sx,sy,sz);
 o.rotation.set(rr(-.25,.25),rr(0,PI),rr(-.16,.16));
 o.castShadow=o.receiveShadow=true;world.add(o);return o
}
rock(-1.34,.45,-.19,.59,.39,.48,1);
rock(-.92,.41,.29,.38,.24,.32,0);
rock(-.34,.45,-.41,.43,.34,.38,2);
rock(.41,.41,-.32,.54,.3,.4,3);
rock(1.12,.44,.21,.57,.37,.42,0);
rock(1.60,.36,-.39,.3,.26,.26,1);
rock(.15,.34,.55,.26,.19,.22,2);

function branch(a,b,r1,r2,material=wood){
 const A=new THREE.Vector3(...a),B=new THREE.Vector3(...b);
 const dir=new THREE.Vector3().subVectors(B,A),len=dir.length();
 const mesh=new THREE.Mesh(new THREE.CylinderGeometry(r2,r1,len,9,2),material);
 mesh.position.copy(A).add(B).multiplyScalar(.5);
 mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),dir.normalize());
 mesh.castShadow=true;mesh.receiveShadow=true;world.add(mesh);return mesh
}
function tree(points,r=.13){
 for(let i=1;i<points.length;i++)branch(points[i-1],points[i],r*(1-(i-1)/points.length*.55),r*(1-i/points.length*.6),i%2?wood:wood2)
}
tree([[-1.31,.35,-.22],[-1.10,.74,-.28],[-.94,1.21,-.30],[-.73,1.67,-.49],[-.51,1.98,-.53]],.17);
tree([[-1.10,.89,-.28],[-1.43,1.24,-.34],[-1.70,1.59,-.29]],.092);
tree([[-.94,1.21,-.30],[-.54,1.46,-.36],[-.25,1.78,-.41]],.084);
tree([[.24,.32,-.22],[.17,.72,-.33],[.31,1.14,-.35],[.52,1.62,-.43],[.77,1.91,-.5]],.175);
tree([[.24,.99,-.32],[-.12,1.34,-.35],[-.34,1.72,-.45]],.089);
tree([[.43,1.38,-.42],[.83,1.54,-.38],[1.05,1.89,-.36]],.09);
tree([[1.58,.36,-.25],[1.43,.82,-.30],[1.42,1.28,-.39],[1.62,1.65,-.45]],.132);
tree([[1.44,1.05,-.33],[1.13,1.32,-.41],[.94,1.64,-.49]],.083);
tree([[-.40,.43,.15],[-.30,.77,.05],[-.11,1.02,-.11],[.07,1.28,-.20]],.094);

function moss(x,y,z,rad=.14){
 for(let i=0;i<13;i++){
  const p=new THREE.Mesh(new THREE.IcosahedronGeometry(rr(.055,.115),1),mossMats[i%3]);
  p.position.set(x+rr(-rad,rad),y+rr(-rad*.5,rad*.5),z+rr(-rad,rad));
  p.scale.set(rr(.7,1.4),rr(.55,1.0),rr(.65,1.2));
  p.castShadow=true;world.add(p)
 }
}
moss(-.72,1.69,-.49,.15);moss(.51,1.59,-.44,.15);
moss(1.40,1.31,-.37,.13);moss(-1.18,.73,-.28,.15);
moss(.31,1.11,-.34,.16);moss(-.29,.83,-.06,.13);

const greens=[0x355f32,0x4d803d,0x689c46,0x78a756,0x2f713f,0x659b58,0x90ab62];
const foliage=greens.map(c=>new THREE.MeshStandardMaterial({color:c,side:THREE.DoubleSide,roughness:.83}));
const movingPlants=[];
function leafMaterial(i){return foliage[Math.floor(rnd()*greens.length)]}
function leaf(x,z,h,wide,angle,tilt,material){
 const v=[],ind=[],N=9;
 for(let j=0;j<=N;j++){
  const t=j/N,curve=Math.sin(t*PI);
  const sway=tilt*t*t,dx=Math.cos(angle),dz=Math.sin(angle);
  const centerX=x+dx*sway,centerZ=z+dz*sway;
  const width=wide*Math.pow(curve,.85);
  v.push(centerX-dz*width,.27+t*h,centerZ+dx*width);
  v.push(centerX+dz*width,.27+t*h,centerZ-dx*width);
  if(j<N){let a=j*2;ind.push(a,a+1,a+2,a+1,a+3,a+2)}
 }
 const g=new THREE.BufferGeometry();
 g.setAttribute('position',new THREE.Float32BufferAttribute(v,3));
 g.setIndex(ind);g.computeVertexNormals();
 const mesh=new THREE.Mesh(g,material);
 mesh.castShadow=true;mesh.receiveShadow=true;world.add(mesh);
}
function cluster(cx,cz,count,minH,maxH,area){
 for(let i=0;i<count;i++){
  const x=cx+rr(-area,area),z=cz+rr(-area,area);
  const h=rr(minH,maxH),w=rr(.04,.10)*(h/.8);
  leaf(x,z,h,w,rr(0,PI*2),rr(.05,.34),leafMaterial(i));
 }
}
cluster(-1.70,-.68,46,.55,1.75,.38);
cluster(-1.02,-.52,36,.58,1.43,.32);
cluster(-.48,-.69,43,.6,1.83,.35);
cluster(.33,-.65,44,.64,1.77,.37);
cluster(1.17,-.66,54,.56,1.78,.42);
cluster(1.78,-.62,30,.66,1.52,.2);
cluster(-1.5,.46,24,.25,.65,.32);
cluster(-.60,.61,28,.18,.54,.43);
cluster(.63,.50,34,.27,.73,.44);
cluster(1.59,.49,31,.20,.67,.31);

const smallGrassGeo=new THREE.ConeGeometry(.014,.27,4);
const grass=new THREE.InstancedMesh(smallGrassGeo,foliage[2],370);
for(let i=0;i<370;i++){
 dummy.position.set(rr(-2.15,2.15),.33,rr(.06,.84));
 dummy.rotation.set(rr(-.25,.25),rr(0,6.28),rr(-.32,.32));
 dummy.scale.set(rr(.7,1.45),rr(.55,1.4),rr(.7,1.3));
 dummy.updateMatrix();grass.setMatrixAt(i,dummy.matrix);
}
grass.castShadow=true;grass.receiveShadow=true;world.add(grass);

const fishBody=m(0xb1d9d7,.34,.14),fishBlue=m(0x0086cb,.24,.16),fishRed=m(0xe95143,.45),fishFin=new THREE.MeshStandardMaterial({color:0x8aadb5,transparent:true,opacity:.79,side:THREE.DoubleSide,roughness:.45});
const eye=m(0x152321,.24),fishList=[];
function createFish(x,y,z,s,phase){
 const group=new THREE.Group(),b=new THREE.Mesh(new THREE.SphereGeometry(1,18,12),fishBody);
 b.scale.set(.18,.065,.049);group.add(b);
 for(const sign of [-1,1]){
  const side=sign*.047;
  const blue=box(.29,.017,.008,fishBlue,-.012,.027,side,group);
  blue.castShadow=false;
  const red=box(.20,.025,.009,fishRed,.031,-.029,side,group);
  red.castShadow=false;
  const iris=new THREE.Mesh(new THREE.SphereGeometry(.012,8,8),eye);
  iris.position.set(.136,.013,sign*.041);group.add(iris);
 }
 const tailGroup=new THREE.Group();
 tailGroup.position.set(-.17,0,0);group.add(tailGroup);
 const tailShape=new THREE.Shape();
 tailShape.moveTo(0,0);tailShape.lineTo(-.135,.09);tailShape.lineTo(-.105,0);tailShape.lineTo(-.135,-.09);tailShape.closePath();
 const tail=new THREE.Mesh(new THREE.ShapeGeometry(tailShape),fishFin);
 tailGroup.add(tail);
 const fin=new THREE.Mesh(new THREE.ConeGeometry(.073,.145,3),fishFin);
 fin.position.set(-.025,.059,0);fin.rotation.z=-PI/2;fin.rotation.x=PI/2;group.add(fin);
 group.position.set(x,y,z);group.scale.setScalar(s);world.add(group);
 fishList.push({group,tail:tailGroup,base:new THREE.Vector3(x,y,z),phase,speed:rr(.38,.7),size:s});
}
createFish(-.98,1.65,.44,.95,.3);
createFish(-.52,1.45,-.03,.86,1.3);
createFish(.05,1.82,.3,1.0,2.4);
createFish(.55,1.44,.25,.92,3.5);
createFish(1.24,1.76,.17,.9,4.9);
createFish(1.47,1.28,-.16,.75,5.9);
createFish(-1.40,1.10,.13,.82,6.6);
createFish(-.05,1.18,.59,.83,7.6);
createFish(.92,1.96,-.25,.92,8.8);
createFish(-.75,2.01,-.31,.76,9.6);

const glass=new THREE.MeshPhysicalMaterial({color:0xe8f5f8,metalness:0,roughness:.08,transparent:true,opacity:.12,depthWrite:false,side:THREE.DoubleSide});
const glassLine=new THREE.LineBasicMaterial({color:0xa1b7bb,transparent:true,opacity:.32});
const waterSide=new THREE.MeshPhysicalMaterial({color:0xc2ebed,transparent:true,opacity:.045,depthWrite:false,side:THREE.BackSide,roughness:.24});
function panel(w,h,x,y,z,axis){
 const plane=new THREE.Mesh(new THREE.PlaneGeometry(w,h),glass);
 plane.position.set(x,y,z);if(axis==='x')plane.rotation.y=PI/2;
 plane.renderOrder=6;world.add(plane);return plane
}
panel(W,H,0,H/2,D/2);
panel(W,H,0,H/2,-D/2);
panel(D,H,-W/2,H/2,0,'x');
panel(D,H,W/2,H/2,0,'x');
const glassBottom=box(W,.025,D,glass,0,.017,0);
const edges=new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(W,H,D)),glassLine);
edges.position.y=H/2;edges.renderOrder=7;world.add(edges);
const topMat=new THREE.MeshPhysicalMaterial({color:0xd2edf3,transparent:true,opacity:.31,roughness:.10,metalness:.02,side:THREE.DoubleSide,depthWrite:false});
const waterTopGeo=new THREE.PlaneGeometry(W-.10,D-.10,33,17);
const waterTop=new THREE.Mesh(waterTopGeo,topMat);
waterTop.rotation.x=-PI/2;waterTop.position.y=H-.155;waterTop.renderOrder=5;
world.add(waterTop);
const waterVolume=new THREE.Mesh(new THREE.BoxGeometry(W-.09,H-.23,D-.09),waterSide);
waterVolume.position.y=(H-.23)/2+.055;world.add(waterVolume);
for(const z of [-D/2,D/2]){
 const rim=box(W,.018,.018,m(0xc8d6d9,.36,.26),0,H,z);
 rim.castShadow=false;
}
for(const x of [-W/2,W/2]){
 const rim=box(.018,.018,D,m(0xc8d6d9,.36,.26),x,H,0);
 rim.castShadow=false;
}

const clock=new THREE.Clock();
const waterPosition=waterTopGeo.attributes.position,basePositions=waterPosition.array.slice();
function animate(){
 const t=clock.getElapsedTime();
 for(let i=0;i<waterPosition.count;i++){
  const k=i*3;
  waterPosition.array[k+2]=basePositions[k+2]+.018*Math.sin(t*1.28+basePositions[k]*2.1+basePositions[k+1]*2.4)+.008*Math.cos(t*.83+basePositions[k]*4);
 }
 waterPosition.needsUpdate=true;waterTopGeo.computeVertexNormals();
 for(const f of fishList){
  const q=t*f.speed+f.phase,g=f.group;
  g.position.x=f.base.x+.22*Math.sin(q);
  g.position.y=f.base.y+.07*Math.sin(q*1.8);
  g.position.z=f.base.z+.13*Math.cos(q*.78);
  let vx=.22*f.speed*Math.cos(q),vz=-.13*.78*f.speed*Math.sin(q*.78);
  g.rotation.y=Math.atan2(-vz,vx);
  f.tail.rotation.y=Math.sin(t*10+f.phase)*.50;
 }
 controls.update();
 renderer.render(scene,camera);
 requestAnimationFrame(animate);
}
function resize(){
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
 const small=innerWidth<700;
 camera.fov=small?48:36;
 camera.updateProjectionMatrix();
}
addEventListener('resize',resize);
resize();animate();
</script>
</body>
</html>
