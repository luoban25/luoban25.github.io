<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>p5.js Volumetric Particle Torus</title>
    <style>
      :root {
        color-scheme: dark;
        background: #000;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #000;
      }

      body {
        display: grid;
        place-items: center;
      }

      canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <noscript>此动画需要启用 JavaScript。</noscript>
    <script src="./vendor/p5.min.js"></script>
    <script>
      "use strict";

      const CONFIG = Object.freeze({
        desktopParticles: 20000,
        mobileParticles: 11000,
        majorRadiusRatio: 0.292,
        minorRadiusRatio: 0.112,
        framesPerSecond: 30,
        flowSlices: 18,
        fieldSpeed: 0.034,
      });

      const TAU_VALUE = Math.PI * 2;
      const GOLDEN_RATIO_CONJUGATE = 0.618033988749895;
      const reducedMotionQuery = window.matchMedia("(prefers-reduced-motion: reduce)");

      let arrays;
      let canvasSide = 0;
      let farSprite;
      let flowSlice = 0;
      let middleSprite;
      let particleCount = 0;
      let reducedMotion = reducedMotionQuery.matches;

      const clamp = (value, minimum, maximum) =>
        Math.min(maximum, Math.max(minimum, value));

      const mix = (from, to, amount) => from + (to - from) * amount;

      const smoothstep = (edge0, edge1, value) => {
        const normalized = clamp((value - edge0) / (edge1 - edge0), 0, 1);
        return normalized * normalized * (3 - 2 * normalized);
      };

      const hash01 = (value) => {
        const sine = Math.sin(value * 12.9898 + 78.233) * 43758.5453;
        return sine - Math.floor(sine);
      };

      const resolveCanvasSide = () =>
        Math.max(220, Math.floor(Math.min(window.innerWidth, window.innerHeight)));

      const chooseParticleCount = () => {
        const mobile =
          window.matchMedia("(max-width: 700px)").matches ||
          navigator.hardwareConcurrency <= 4;
        return mobile ? CONFIG.mobileParticles : CONFIG.desktopParticles;
      };

      const createSoftSprite = (diameter, innerStop) => {
        const sprite = document.createElement("canvas");
        sprite.width = diameter;
        sprite.height = diameter;
        const context = sprite.getContext("2d");
        const center = diameter * 0.5;
        const gradient = context.createRadialGradient(
          center,
          center,
          0,
          center,
          center,
          center,
        );
        gradient.addColorStop(0, "rgba(255,255,255,1)");
        gradient.addColorStop(innerStop, "rgba(255,255,255,0.72)");
        gradient.addColorStop(1, "rgba(255,255,255,0)");
        context.fillStyle = gradient;
        context.fillRect(0, 0, diameter, diameter);
        return sprite;
      };

      const allocateArrays = () => {
        const floatNames = [
          "baseU",
          "baseV",
          "tubeScale",
          "phase",
          "baseX",
          "baseY",
          "baseZ",
          "staticLow",
          "staticHigh",
          "staticDensity",
          "densityThreshold",
          "baseSize",
          "baseAlpha",
          "flowU",
          "flowV",
          "flowR",
          "flowDetail",
          "flowDensity",
          "targetU",
          "targetV",
          "targetR",
          "targetDetail",
          "targetDensity",
          "visibility",
        ];

        arrays = Object.fromEntries(
          floatNames.map((name) => [name, new Float32Array(particleCount)]),
        );
      };

      const sampleFields = (index, time) => {
        const x = arrays.baseX[index];
        const y = arrays.baseY[index];
        const z = arrays.baseZ[index];

        arrays.targetU[index] = noise(
          41 + x * 0.82,
          41 + y * 0.82,
          41 + z * 0.82 + time,
        );
        arrays.targetV[index] = noise(
          57 + x * 1.14,
          57 + y * 1.14 + time * 0.71,
          57 + z * 1.14,
        );
        arrays.targetR[index] = noise(
          73 + x * 0.58 + time * 0.42,
          73 + y * 0.58,
          73 + z * 0.58,
        );
        arrays.targetDetail[index] = noise(
          91 + x * 2.65,
          91 + y * 2.65,
          91 + z * 2.65 + time * 1.24,
        );
        arrays.targetDensity[index] = noise(
          119 + x * 0.94,
          119 + y * 0.94 + time * 0.56,
          119 + z * 0.94,
        );
      };

      const initialiseParticles = () => {
        noiseSeed(0x74a9);

        for (let index = 0; index < particleCount; index += 1) {
          const h1 = hash01(index * 1.137 + 0.17);
          const h2 = hash01(index * 2.417 + 11.9);
          const h3 = hash01(index * 4.731 + 29.3);
          const h4 = hash01(index * 8.219 + 47.7);
          const h5 = hash01(index * 13.37 + 71.1);
          const baseU =
            TAU_VALUE * ((index * GOLDEN_RATIO_CONJUGATE + h1 * 0.014) % 1);
          const baseV = TAU_VALUE * h2;
          const surfaceBiased = h3 < 0.68;
          const tubeScale = surfaceBiased
            ? 0.8 + h4 * 0.3
            : 0.2 + Math.sqrt(h4) * 0.62;
          const cosU = Math.cos(baseU);
          const sinU = Math.sin(baseU);
          const cosV = Math.cos(baseV);
          const sinV = Math.sin(baseV);
          const normalizedTube = 0.38 * tubeScale;
          const baseX = (1 + normalizedTube * cosV) * cosU;
          const baseY = (1 + normalizedTube * cosV) * sinU;
          const baseZ = normalizedTube * sinV;

          arrays.baseU[index] = baseU;
          arrays.baseV[index] = baseV;
          arrays.tubeScale[index] = tubeScale;
          arrays.phase[index] = h5 * TAU_VALUE;
          arrays.baseX[index] = baseX;
          arrays.baseY[index] = baseY;
          arrays.baseZ[index] = baseZ;
          arrays.staticLow[index] = noise(
            5 + baseX * 0.52,
            5 + baseY * 0.52,
            5 + baseZ * 0.52,
          );
          arrays.staticHigh[index] = noise(
            17 + baseX * 2.35,
            17 + baseY * 2.35,
            17 + baseZ * 2.35,
          );
          arrays.staticDensity[index] = noise(
            31 + baseX * 0.86,
            31 + baseY * 0.86,
            31 + baseZ * 0.86,
          );
          arrays.densityThreshold[index] = 0.35 + h1 * 0.18;

          if (h5 < 0.8) {
            arrays.baseSize[index] = 0.58 + h4 * 0.58;
            arrays.baseAlpha[index] = 0.38 + h3 * 0.42;
          } else if (h5 < 0.97) {
            arrays.baseSize[index] = 1.05 + h4 * 0.85;
            arrays.baseAlpha[index] = 0.58 + h3 * 0.38;
          } else {
            arrays.baseSize[index] = 1.9 + h4 * 1.55;
            arrays.baseAlpha[index] = 0.82 + h3 * 0.18;
          }

          sampleFields(index, 0);
          arrays.flowU[index] = arrays.targetU[index];
          arrays.flowV[index] = arrays.targetV[index];
          arrays.flowR[index] = arrays.targetR[index];
          arrays.flowDetail[index] = arrays.targetDetail[index];
          arrays.flowDensity[index] = arrays.targetDensity[index];
          const initialDensity =
            arrays.staticDensity[index] * 0.58 +
            arrays.flowDensity[index] * 0.42 +
            (arrays.flowDetail[index] - 0.5) * 0.2;
          arrays.visibility[index] = smoothstep(
            arrays.densityThreshold[index] - 0.11,
            arrays.densityThreshold[index] + 0.09,
            initialDensity,
          );
        }
      };

      const rebuildParticlePool = () => {
        particleCount = chooseParticleCount();
        allocateArrays();
        initialiseParticles();
      };

      const updateFlowField = (time, deltaSeconds) => {
        const fieldTime = reducedMotion ? 1.7 : time * CONFIG.fieldSpeed;
        const activeSlice = flowSlice % CONFIG.flowSlices;

        for (
          let index = activeSlice;
          index < particleCount;
          index += CONFIG.flowSlices
        ) {
          sampleFields(index, fieldTime);
        }

        flowSlice += 1;
        const fieldEase = 1 - Math.exp(-deltaSeconds * 2.2);
        const visibilityEase = 1 - Math.exp(-deltaSeconds * 3.1);

        for (let index = 0; index < particleCount; index += 1) {
          arrays.flowU[index] = mix(arrays.flowU[index], arrays.targetU[index], fieldEase);
          arrays.flowV[index] = mix(arrays.flowV[index], arrays.targetV[index], fieldEase);
          arrays.flowR[index] = mix(arrays.flowR[index], arrays.targetR[index], fieldEase);
          arrays.flowDetail[index] = mix(
            arrays.flowDetail[index],
            arrays.targetDetail[index],
            fieldEase,
          );
          arrays.flowDensity[index] = mix(
            arrays.flowDensity[index],
            arrays.targetDensity[index],
            fieldEase,
          );

          const densityField =
            arrays.staticDensity[index] * 0.58 +
            arrays.flowDensity[index] * 0.42 +
            (arrays.flowDetail[index] - 0.5) * 0.2;
          const targetVisibility = smoothstep(
            arrays.densityThreshold[index] - 0.11,
            arrays.densityThreshold[index] + 0.09,
            densityField,
          );
          arrays.visibility[index] = mix(
            arrays.visibility[index],
            targetVisibility,
            visibilityEase,
          );
        }
      };

      const drawCrispParticle = (context, x, y, size, alpha) => {
        context.globalAlpha = alpha;
        if (size > 1.35) {
          context.beginPath();
          context.arc(x, y, size * 0.5, 0, TAU_VALUE);
          context.fill();
        } else {
          context.fillRect(x - size * 0.5, y - size * 0.5, size, size);
        }
      };

      const drawSoftParticle = (context, sprite, x, y, size, alpha, spread) => {
        const diameter = size * spread;
        context.globalAlpha = alpha;
        context.drawImage(
          sprite,
          x - diameter * 0.5,
          y - diameter * 0.5,
          diameter,
          diameter,
        );
      };

      const renderTorus = (context, time) => {
        const center = canvasSide * 0.5;
        const responsiveScale = clamp(canvasSide / 500, 0.72, 1.12);
        const breathing = 1 + Math.sin(time * 0.27) * 0.004;
        const majorRadius = canvasSide * CONFIG.majorRadiusRatio * breathing;
        const minorRadius = canvasSide * CONFIG.minorRadiusRatio;
        const tiltX = 0.07 + Math.sin(time * 0.065) * 0.012;
        const tiltY = -0.052 + Math.cos(time * 0.057) * 0.01;
        const tiltZ = Math.sin(time * 0.043) * 0.006;
        const cosX = Math.cos(tiltX);
        const sinX = Math.sin(tiltX);
        const cosY = Math.cos(tiltY);
        const sinY = Math.sin(tiltY);
        const cosZ = Math.cos(tiltZ);
        const sinZ = Math.sin(tiltZ);
        const cameraDistance = majorRadius * 6.4;

        for (let index = 0; index < particleCount; index += 1) {
          const visibility = arrays.visibility[index];
          if (visibility < 0.012) continue;

          const phase = arrays.phase[index];
          const u =
            arrays.baseU[index] +
            (arrays.flowU[index] - 0.5) * 0.11 +
            Math.sin(time * 0.12 + phase) * 0.012;
          const v =
            arrays.baseV[index] +
            (arrays.flowV[index] - 0.5) * 0.4 +
            Math.sin(time * 0.16 + phase * 1.7) * 0.028;
          const localMajor =
            majorRadius *
            (1 +
              (arrays.staticLow[index] - 0.5) * 0.045 +
              (arrays.flowR[index] - 0.5) * 0.026);
          const tubeFold = clamp(
            1 +
              (arrays.staticHigh[index] - 0.5) * 0.5 +
              (arrays.flowDetail[index] - 0.5) * 0.24,
            0.68,
            1.32,
          );
          const localTube = minorRadius * arrays.tubeScale[index] * tubeFold;
          const cosU = Math.cos(u);
          const sinU = Math.sin(u);
          const cosV = Math.cos(v);
          const sinV = Math.sin(v);

          // True three-dimensional torus coordinates.
          const x = (localMajor + localTube * cosV) * cosU;
          const y = (localMajor + localTube * cosV) * sinU;
          const z = localTube * sinV;

          const zRotatedX = x * cosZ - y * sinZ;
          const zRotatedY = x * sinZ + y * cosZ;
          const xRotatedY = zRotatedX * cosY + z * sinY;
          const firstDepth = -zRotatedX * sinY + z * cosY;
          const yRotatedX = zRotatedY * cosX - firstDepth * sinX;
          const depth = zRotatedY * sinX + firstDepth * cosX;
          const perspective = cameraDistance / (cameraDistance - depth);
          const screenX = center + xRotatedY * perspective;
          const screenY = center + yRotatedX * perspective;
          const normalizedDepth = clamp(0.5 + depth / (minorRadius * 3.1), 0, 1);
          const depthSize = mix(0.64, 1.38, normalizedDepth);
          const depthBrightness = mix(0.42, 1, normalizedDepth);
          const densityField =
            arrays.staticDensity[index] * 0.58 + arrays.flowDensity[index] * 0.42;
          const densityBrightness = mix(
            0.48,
            1,
            smoothstep(0.34, 0.68, densityField),
          );
          const size = arrays.baseSize[index] * depthSize * responsiveScale;
          const alpha =
            arrays.baseAlpha[index] *
            visibility *
            depthBrightness *
            densityBrightness;

          if (normalizedDepth < 0.34) {
            drawSoftParticle(
              context,
              farSprite,
              screenX,
              screenY,
              size,
              alpha * 0.78,
              3.2,
            );
          } else if (normalizedDepth < 0.58) {
            drawSoftParticle(
              context,
              middleSprite,
              screenX,
              screenY,
              size,
              alpha * 0.9,
              2.1,
            );
          } else {
            drawCrispParticle(context, screenX, screenY, size, alpha);
          }
        }
      };

      function setup() {
        canvasSide = resolveCanvasSide();
        pixelDensity(Math.min(window.devicePixelRatio || 1, 1.5));
        createCanvas(canvasSide, canvasSide);
        noiseDetail(3, 0.52);
        frameRate(CONFIG.framesPerSecond);
        noStroke();
        farSprite = createSoftSprite(24, 0.08);
        middleSprite = createSoftSprite(18, 0.2);
        rebuildParticlePool();
        if (reducedMotion) noLoop();
      }

      function draw() {
        const context = drawingContext;
        const time = reducedMotion ? 8.2 : millis() / 1000;
        const deltaSeconds = reducedMotion ? 1 / 30 : Math.min(deltaTime / 1000, 0.1);

        updateFlowField(time, deltaSeconds);
        context.globalCompositeOperation = "source-over";
        context.globalAlpha = 1;
        context.fillStyle = "#000";
        context.fillRect(0, 0, width, height);
        context.globalCompositeOperation = "lighter";
        context.fillStyle = "#fff";
        context.imageSmoothingEnabled = true;
        renderTorus(context, time);
        context.globalCompositeOperation = "source-over";
        context.globalAlpha = 1;
      }

      function windowResized() {
        const nextSide = resolveCanvasSide();
        if (nextSide === canvasSide) return;

        const previousCount = particleCount;
        canvasSide = nextSide;
        resizeCanvas(canvasSide, canvasSide);
        particleCount = chooseParticleCount();
        if (particleCount !== previousCount) {
          allocateArrays();
          initialiseParticles();
        }
        if (reducedMotion) redraw();
      }

      const handleVisibilityChange = () => {
        if (document.hidden) {
          noLoop();
        } else if (!reducedMotion) {
          loop();
        }
      };

      const handleReducedMotionChange = (event) => {
        reducedMotion = event.matches;
        if (reducedMotion) {
          noLoop();
          redraw();
        } else if (!document.hidden) {
          loop();
        }
      };

      document.addEventListener("visibilitychange", handleVisibilityChange);
      reducedMotionQuery.addEventListener("change", handleReducedMotionChange);
    </script>
  </body>
</html>
